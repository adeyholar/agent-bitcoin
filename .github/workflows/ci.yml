name: CI - Lint & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      # Suppress deprecation warning
      - name: GitHub Actions - Node 20 Deprecation Notice
        run: |
          echo "⚠️  GitHub is deprecating Node.js 20."
          echo "   Our actions (checkout, setup-python, setup-uv) still declare it internally."
          echo "   They are running on Node 24. This warning is harmless."

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"

      - name: Install dependencies
        # Pin 3.12: pynostr/coincurve lack reliable 3.14 wheels; uv may otherwise
        # pick latest CPython. Include nostr extra for NWC client tests.
        # --group bolt11: invoice fixture encode (not a default uv group; 3.14 has no coincurve wheel)
        run: uv sync --python 3.12 --dev --extra nostr --group bolt11

      - name: Run Ruff
        run: uv run --python 3.12 ruff check .

      # Prefer ruff format (same as pre-commit). Black and ruff-format can
      # disagree on assert wrapping; one formatter only avoids red CI.
      - name: Run Ruff format
        run: uv run --python 3.12 ruff format --check .

      - name: Run tests
        run: uv run --python 3.12 pytest
